services:
  redis:
    image: redis:alpine
    container_name: global_counter_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
  
  db_service:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init-db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fraud-guard-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports: 
      - "5000:5000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_MLFLOW: ${DB_MLFLOW}
    volumes:
      - mlflow_data:/mlflow
    # --host 0.0.0.0 -> mlflow server accepts connetions from everyone even from outside the docker
    # --port 5000 -> the mlflow server is reachable on this port
    # --backend-store-uri sqlite:///mlflow/mlflow.db -> path to the sql lite db
    # artifacts-destination /mlflow/artifacts -> Define the path to store the model, plots, csv files etc.
    # --allowed-hosts localhost:5000,127.0.0.1:5000,host.docker.internal:5000,mlflow:5000 -> Security feature to define how may communicate with the mlflow server
    entrypoint: >
      bash -c "pip install psycopg2-binary && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://$${DB_USER}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_MLFLOW} --artifacts-destination /mlflow/artifacts --allowed-hosts '*'"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)\""
        ]
      interval: 30s
      timeout: 30s
      retries: 5
    networks: 
      - fraud-guard-network

  prefect-server:
    image: prefecthq/prefect:3.8.0-python3.11
    container_name: prefect_server
    restart: always
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200" # Prefect Dashboard UI & API
    environment:
      PREFECT_SERVER_API_HOST: ${PREFECT_SERVER_API_HOST}
      PREFECT_SERVER_UI_API_URL: ${PREFECT_SERVER_UI_API_URL}
      PREFECT_UI_URL: ${PREFECT_UI_URL}
      # PREFECT_API_URL: ${PREFECT_API_URL}
      DB_PREFECT: ${DB_PREFECT}
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_PREFECT}
    depends_on:
      db_service:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      # HTTP-Check direkt gegen den Prefect-Health-Endpunkt
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fraud-guard-network

  prefect-worker:
    build:
      context: .
      dockerfile: prefect/Dockerfile
    container_name: prefect_worker
    depends_on:
      prefect-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./data/prefect_volume:/data
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL}
      PYTHONPATH: /prefect
      DATA_DIR_INCOMING: /data/incoming
      DATA_DIR_PROCESSED: /data/processed
      DATA_DIR_QUARANTINE: /data/quarantine
      DBT_PROJECT_DIR: /prefect/dbt
      DBT_SCHEMA: ${DBT_SCHEMA}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MODEL_NAME: ${MODEL_NAME}
      DEFAULT_MODEL_ALIAS: ${DEFAULT_MODEL_ALIAS}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_TABLE_NAME: ${DB_TABLE_NAME}
      DB_URI: ${DB_URI}
      REDIS_HOST: redis

    networks:
      - fraud-guard-network
  
  api-service:
    build:
      context: webservice
      dockerfile: Dockerfile
    container_name: fastapi
    depends_on:
      prefect-worker:
        condition: service_started
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./webservice:/webservice
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MODEL_NAME: ${MODEL_NAME}
      DEFAULT_MODEL_ALIAS: ${DEFAULT_MODEL_ALIAS}
      DB_URI: ${DB_URI}
      REDIS_HOST: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - fraud-guard-network

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: prometheus
    depends_on:
      api-service:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yaml
    networks:
      - fraud-guard-network

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fraud-guard-network


  # evidently_service:
  #   build:
  #     context: evidently_service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8085:8085"
  #   networks:
  #     - fraud-guard-network


volumes:
  mlflow_data:
  dbdata:
  grafana-data:
  prometheus-data:
  redis_data:

networks:
  fraud-guard-network:
    driver: bridge


