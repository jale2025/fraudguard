version: 2

models:
  - name: fct_training_data
    description: Mart model with the training data for the fraud detection model.
    columns:
      - name: elapsed_sec
        description: Time elapsed in seconds since the first transaction.
        data_tests:
          - not_null
      - name: amount
        description: Amount of the transaction.
        data_tests:
          - not_null
      - name: class
        description: Target (fraudulant or not fraudulant)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
          - relationships:
              arguments:
                to: ref('target_labels')
                field: class

  - name: fct_predictions
    description: Mart model with the predictions served by the api.
    columns:
      - name: elapsed_sec
        description: Time elapsed in seconds since the first transaction.
        data_tests:
          - not_null
      - name: amount
        description: Amount of the transaction.
        data_tests:
          - not_null
      - name: prediction
        description: Class predicted by the model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
          - relationships:
              arguments:
                to: ref('target_labels')
                field: class
