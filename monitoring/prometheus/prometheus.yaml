global:
  scrape_interval: 15s # collect /metrics every scrape_interval
  evaluation_interval: 15s # evaluate rules and alerts every evaluation_interval

scrape_configs:
  - job_name: fraudguard-api
    metrics_path: /metrics/
    static_configs:
      - targets:
          - api-service:8000

rule_files:
  - /etc/prometheus/alert_rules.yaml


