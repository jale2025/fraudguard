[tool.ruff]
# Target Python version
target-version = "py311"

# Maximum line length 
line-length = 88

exclude = [
    "*.ipynb",
    "notebooks/",
]

[tool.ruff.lint]
# Rules to be considered
select = [
    "E",   # pycodestyle Errors
    "W",   # pycodestyle Warnings
    "F",   # Pyflakes (Logical errors, unused variables/imports)
    "I",   # isort (Automatic sorting of imports)
    "B",   # flake8-bugbear (Potential design flaws/bugs)
    "N",   # pep8-naming (Naming conventions)
    "D",   # pydocstyle (Docstring formatting & completeness checks)
]

# Exceptions (rules to be ignored)
ignore = [
    "E501", # Ignore line length errors for long URLs or unbreakable SQL queries
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]